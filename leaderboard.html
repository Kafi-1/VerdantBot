<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ed">
  <title>Verdant — Leaderboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <p>Loading leaderboard...</p>
</div>

<div class="app">
  <div class="topbar">
    <div class="topbar-title">Leaderboard</div>
  </div>

  <div class="page">
    <div class="lb-hero">
      <h2>🏆 Top Earners</h2>
      <p>Compete with others and climb the ranks</p>
    </div>

    <div class="lb-tabs">
      <button class="lb-tab active" data-lb-tab="all">All Time</button>
      <button class="lb-tab" data-lb-tab="week">This Week</button>
      <button class="lb-tab" data-lb-tab="month">This Month</button>
    </div>

    <div class="lb-list" data-lb-list>
      <!-- Filled by JS — includes demo data -->
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">⌂</span> Home
    </a>
    <a href="tasks.html" class="nav-item">
      <span class="nav-icon">✳</span> Tasks
    </a>
    <a href="leaderboard.html" class="nav-item active">
      <span class="nav-icon">🏆</span> Rank
    </a>
    <a href="wallet.html" class="nav-item">
      <span class="nav-icon">◇</span> Wallet
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">◎</span> Profile
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/firebase-config.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
