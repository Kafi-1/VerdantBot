<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ed">
  <title>Verdant — Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <p>Loading wallet...</p>
</div>

<div class="app">
  <div class="topbar">
    <div class="topbar-title">My Wallet</div>
  </div>

  <div class="page">
    <div class="wallet-hero">
      <div class="label">Total Available</div>
      <div class="total" data-wallet-balance>$0<small>.00</small></div>
      <div class="wallet-stats">
        <div>
          <small>Pending</small>
          <strong data-wallet-pending>$0.00</strong>
        </div>
        <div>
          <small>Lifetime</small>
          <strong data-wallet-lifetime>$0.00</strong>
        </div>
        <div>
          <small>Withdrawn</small>
          <strong data-wallet-withdrawn>$0.00</strong>
        </div>
      </div>
    </div>

    <button class="btn-primary" data-open-withdraw>
      ↗ Request Withdrawal
    </button>

    <div class="section-head">
      <h2>Recent activity</h2>
    </div>

    <div class="tx-list" data-tx-list>
      <!-- Filled by JS -->
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">⌂</span> Home
    </a>
    <a href="tasks.html" class="nav-item">
      <span class="nav-icon">✳</span> Tasks
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span class="nav-icon">🏆</span> Rank
    </a>
    <a href="wallet.html" class="nav-item active">
      <span class="nav-icon">◇</span> Wallet
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">◎</span> Profile
    </a>
  </nav>
</div>

<!-- Withdraw Modal -->
<div class="modal-overlay" id="withdraw-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Request Withdrawal</h3>
    <p>Minimum $2.00 · Processing 1–3 business days</p>
    <form data-withdraw-form>
      <div class="form-field">
        <label>Amount (USD)</label>
        <input type="number" name="amount" placeholder="0.00" min="2" step="0.01" required>
      </div>
      <div class="form-field">
        <label>Payment Method</label>
        <select name="method" required>
          <option value="">Select method</option>
          <option value="bKash">bKash</option>
          <option value="Nagad">Nagad</option>
          <option value="Rocket">Rocket</option>
          <option value="USDT">USDT (TRC20)</option>
        </select>
      </div>
      <div class="form-field">
        <label>Account / Number</label>
        <input type="text" name="account" placeholder="01XXXXXXXXX or wallet address" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close-modal>Cancel</button>
        <button type="submit" class="btn-primary">Submit</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/firebase-config.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
