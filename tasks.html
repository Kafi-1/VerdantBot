<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ed">
  <title>Verdant — Tasks</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <p>Loading tasks...</p>
</div>

<div class="app">
  <div class="topbar">
    <div class="topbar-title">Earn Tasks</div>
  </div>

  <div class="page">
    <div class="progress-banner">
      <div class="ring" data-progress-ring style="--progress: 0%"><span>0%</span></div>
      <div class="info" data-progress-text>
        <strong>0 / 5 tasks today</strong>
        <small>Start earning!</small>
      </div>
    </div>

    <div class="search-box">
      <span>⌕</span>
      <input type="search" placeholder="Search tasks..." data-search>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="quick">Quick</button>
      <button class="filter-tab" data-filter="learn">Learning</button>
      <button class="filter-tab" data-filter="survey">Surveys</button>
      <button class="filter-tab" data-filter="social">Social</button>
    </div>

    <div class="task-list" data-task-list>
      <!-- Filled by JS -->
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">⌂</span> Home
    </a>
    <a href="tasks.html" class="nav-item active">
      <span class="nav-icon">✳</span> Tasks
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span class="nav-icon">🏆</span> Rank
    </a>
    <a href="wallet.html" class="nav-item">
      <span class="nav-icon">◇</span> Wallet
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">◎</span> Profile
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/firebase-config.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
